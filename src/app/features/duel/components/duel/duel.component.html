@if (this.duelCompleted$ | async; as duelCompletedDetails) {
  <app-duel-summary
    [duelCompletedDetails]="duelCompletedDetails"
    (summaryClosed)="closeSummary()"
  >
  </app-duel-summary>
} @else {
  <div class="question-view">
    <app-question-page></app-question-page>
    <button class="button button--cancel" type="button" (click)="abandonDuel()">
      Abandon
    </button>
  </div>
}
