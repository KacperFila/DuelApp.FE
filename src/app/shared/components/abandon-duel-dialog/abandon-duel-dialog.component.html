<h2 mat-dialog-title>Abandon duel</h2>

<mat-dialog-content> Are you sure you want to leave? </mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>

  <button mat-raised-button color="warn" (click)="abandonDuel()">
    Abandon
  </button>
</mat-dialog-actions>
