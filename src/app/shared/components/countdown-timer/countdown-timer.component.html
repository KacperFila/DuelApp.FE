<section [class.warn]="isWarn()" [class.danger]="isDanger()">
  <div class="timer">
    @if (secondsRemaining()) {
      <span class="label">Time left:</span>
      <span class="value">
        {{ formattedRemaining() }}
      </span>
    } @else {
      <span class="label">Time's up!</span>
    }
  </div>
  <div class="progress">
    <div class="bar" [style.width.%]="progress()"></div>
  </div>
</section>
